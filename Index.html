<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Flappy Bird - Enhanced Character</title>
    <style>
        body {
            margin: 0;
            background-color: #121824;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            border: 4px solid #3b2812;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            background-color: #4ec0ca;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

// Game State
let gameState = "START"; // "START", "PLAYING", "GAMEOVER"
let score = 0;
let highscore = localStorage.getItem("ult_flappy_highscore") ? parseInt(localStorage.getItem("ult_flappy_highscore")) : 0;
let frameCount = 0;

// Polish & FX
let shakeDuration = 0;
let flashOpacity = 0;
let scoreScale = 1;
const particles = [];
const floatingTexts = [];

// Game Constants
const GRAVITY = 0.36;
const JUMP_FORCE = -6.2;
const PIPE_SPEED = 2.0;
const PIPE_SPACING = 200;
const PIPE_GAP = 135;

// Web Audio API Sound Generator
let audioCtx;
function playSound(type) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start();
        osc.stop(now + 0.08);
    } else if (type === 'score') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.setValueAtTime(880, now + 0.06);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start();
        osc.stop(now + 0.15);
    } else if (type === 'feather') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880, now + 0.08);
        osc.frequency.setValueAtTime(1174.66, now + 0.16);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start();
        osc.stop(now + 0.25);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start();
        osc.stop(now + 0.25);
    }
}

// Particle System
function createParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            size: Math.floor(Math.random() * 3) + 2,
            color: color,
            life: 1.0
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) {
            particles.splice(i, 1);
        } else {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
            ctx.globalAlpha = 1.0;
        }
    }
}

// Floating Text FX
function spawnFloatingText(x, y, text, color = "#ffffff") {
    floatingTexts.push({ x: x, y: y, text: text, color: color, life: 1.0, vy: -1.2 });
}

function updateFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life -= 0.025;
        if (ft.life <= 0) {
            floatingTexts.splice(i, 1);
        } else {
            ctx.fillStyle = ft.color;
            ctx.globalAlpha = ft.life;
            ctx.font = "bold 20px 'Courier New', monospace";
            ctx.textAlign = "center";
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 3;
            ctx.strokeText(ft.text, ft.x, ft.y);
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.globalAlpha = 1.0;
        }
    }
}

// REDESIGNED & MUCH MORE COOL CHARACTER
const bird = {
    x: 70, y: 280,
    width: 36, height: 26,
    velocity: 0,
    wingAngle: 0,
    reset: function() {
        this.y = 280;
        this.velocity = 0;
    },
    flap: function() {
        this.velocity = JUMP_FORCE;
        playSound('jump');
        createParticles(this.x, this.y + this.height / 2, '#ff4500', 6);
        createParticles(this.x - 5, this.y + this.height / 2, '#ffcc00', 4);
    },
    update: function() {
        this.velocity += GRAVITY;
        this.y += this.velocity;
    },
    draw: function() {
        ctx.save();
        ctx.translate(Math.floor(this.x + this.width / 2), Math.floor(this.y + this.height / 2));
        
        let rotation = Math.min(Math.PI / 3, Math.max(-Math.PI / 5, this.velocity * 0.08));
        ctx.rotate(rotation);
        ctx.translate(-this.width / 2, -this.height / 2);

        // 1. Ekor Api / Feather Tail
        ctx.fillStyle = "#ff2200";
        ctx.fillRect(-6, 8, 8, 8);
        ctx.fillStyle = "#ffaa00";
        ctx.fillRect(-8, 10, 6, 4);

        // 2. Badannya (Tubuh Utama Merah/Oranye Gradient Effect)
        ctx.fillStyle = "#ff3300";
        ctx.fillRect(2, 4, 30, 18);
        ctx.fillStyle = "#ff6600";
        ctx.fillRect(4, 2, 26, 18);
        ctx.fillStyle = "#ffaa00";
        ctx.fillRect(6, 4, 18, 6); // Highlighting Atas

        // 3. Perut (Belly Patch Soft Yellow)
        ctx.fillStyle = "#ffe600";
        ctx.fillRect(8, 14, 12, 6);

        // 4. Paruh Keren / Sharp Beak
        ctx.fillStyle = "#ff8800";
        ctx.fillRect(24, 12, 12, 8);
        ctx.fillStyle = "#ffcc00";
        ctx.fillRect(24, 12, 10, 3);
        ctx.fillStyle = "#cc4400";
        ctx.fillRect(26, 17, 10, 3);

        // 5. Kacamata Hitam / Cool Sunglasses
        ctx.fillStyle = "#111111";
        ctx.fillRect(16, 4, 16, 8);
        ctx.fillRect(14, 6, 20, 4);
        // Kilau Kacamata
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(18, 5, 4, 2);
        ctx.fillRect(28, 5, 2, 2);

        // 6. Mahkota / Jambul Api Atas (Crest)
        ctx.fillStyle = "#ff0055";
        ctx.fillRect(8, -4, 6, 6);
        ctx.fillRect(14, -6, 6, 8);
        ctx.fillStyle = "#ffcc00";
        ctx.fillRect(10, -2, 3, 4);

        // 7. Animasi Sayap Bertingkat (Dynamic Wing Flap)
        this.wingAngle += 0.25;
        let wingY = Math.sin(this.wingAngle) * 5;

        // Sayap Belakang (Shadow)
        ctx.fillStyle = "#cc0000";
        ctx.fillRect(2, 8 + wingY, 14, 10);
        
        // Sayap Depan (Layer Utama)
        ctx.fillStyle = "#ff5500";
        ctx.fillRect(4, 6 + wingY, 12, 8);
        ctx.fillStyle = "#ffcc00";
        ctx.fillRect(4, 10 + wingY, 12, 3);

        // Outline Hitam Tegas (Pixel Border Effect)
        ctx.strokeStyle = "#1a0500";
        ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, 33, 23);

        ctx.restore();
    }
};

// Background System
const background = {
    clouds: [],
    stars: [],
    init: function() {
        for (let i = 0; i < 16; i++) {
            this.clouds.push(this.createCloud(Math.random() * (canvas.width + 200) - 100));
        }
        for (let i = 0; i < 30; i++) {
            this.stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * 250,
                size: Math.floor(Math.random() * 2) + 1
            });
        }
    },
    createCloud: function(xOverride = null) {
        let z = 0.2 + Math.random() * 0.8;
        return {
            x: xOverride !== null ? xOverride : canvas.width + 100,
            y: Math.random() * (canvas.height - 140),
            z: z,
            baseWidth: 60 + Math.random() * 40,
            baseHeight: 25 + Math.random() * 15,
            speed: z * 1.8
        };
    },
    update: function() {
        let speedMult = (gameState === "PLAYING" ? 1.0 : 0.3);
        for (let i = 0; i < this.clouds.length; i++) {
            let c = this.clouds[i];
            c.x -= c.speed * speedMult;
            if (c.x + (c.baseWidth * c.z) < -100) {
                this.clouds[i] = this.createCloud();
            }
        }
        this.clouds.sort((a, b) => a.z - b.z);
    },
    draw: function() {
        let sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        if (score >= 20) {
            sky.addColorStop(0, '#0a0a1a');
            sky.addColorStop(0.5, '#1a1a3a');
            sky.addColorStop(1, '#2a2a5a');
        } else if (score >= 10) {
            sky.addColorStop(0, '#e65c00');
            sky.addColorStop(0.5, '#f98b32');
            sky.addColorStop(1, '#ffc371');
        } else {
            sky.addColorStop(0, '#3ba2b8');
            sky.addColorStop(0.5, '#4ec0ca');
            sky.addColorStop(1, '#a1e4e8');
        }
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (score >= 20) {
            ctx.fillStyle = "#ffffff";
            this.stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));
        }

        this.clouds.forEach(c => {
            let width = c.baseWidth * (0.5 + c.z * 0.5);
            let height = c.baseHeight * (0.5 + c.z * 0.5);
            let rx = Math.floor(c.x);
            let ry = Math.floor(c.y);

            ctx.globalAlpha = score >= 20 ? 0.2 + (c.z * 0.3) : 0.4 + (c.z * 0.55);
            ctx.fillStyle = score >= 20 ? "#8888aa" : score >= 10 ? "#ffe0cc" : "#ffffff";
            ctx.fillRect(rx, ry, width, height);
            ctx.fillRect(rx + (width * 0.1), ry - (height * 0.4), width * 0.8, height * 1.4);

            ctx.fillStyle = score >= 20 ? "rgba(40, 40, 80, 0.6)" : "rgba(180, 220, 230, 0.6)";
            ctx.fillRect(rx, ry + height - (height * 0.25), width, height * 0.25);
            ctx.globalAlpha = 1.0;
        });

        let gy = canvas.height - 50;
        ctx.fillStyle = '#73bf2e';
        ctx.fillRect(0, gy, canvas.width, 14);
        ctx.fillStyle = '#9ce659';
        ctx.fillRect(0, gy, canvas.width, 3);
        ctx.fillStyle = '#ded895';
        ctx.fillRect(0, gy + 14, canvas.width, 36);

        ctx.fillStyle = '#c8bf73';
        let scrollX = frameCount * (gameState === "PLAYING" ? 2 : 0.5);
        let offset = Math.floor(scrollX) % 16;
        for (let gx = -offset; gx < canvas.width; gx += 16) {
            ctx.fillRect(gx, gy + 22, 8, 4);
            ctx.fillRect(gx + 8, gy + 34, 8, 4);
        }
    }
};

// Pipes & Feathers
const pipes = [];
const feathers = [];

function spawnPipe() {
    const minH = 50;
    const maxH = canvas.height - PIPE_GAP - 120;
    const topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;
    pipes.push({ x: canvas.width, top: topH, passed: false });

    if (Math.random() < 0.4) {
        feathers.push({
            x: canvas.width + 27,
            y: topH + PIPE_GAP / 2,
            collected: false,
            floatOffset: Math.random() * Math.PI * 2
        });
    }
}

function drawPipe(x, y, w, h, isTop) {
    let px = Math.floor(x);
    let py = Math.floor(y);

    let grad = ctx.createLinearGradient(px, 0, px + w, 0);
    grad.addColorStop(0, '#a3e832');
    grad.addColorStop(0.2, '#73bf2e');
    grad.addColorStop(0.7, '#549f1a');
    grad.addColorStop(1, '#30610c');

    ctx.fillStyle = grad;
    ctx.fillRect(px, py, w, h);

    ctx.fillStyle = '#c5f263';
    ctx.fillRect(px + 4, py, 4, h);
    ctx.fillStyle = '#214407';
    ctx.fillRect(px + w - 4, py, 4, h);

    const capH = 24;
    const capExtraWidth = 4;
    const capX = px - capExtraWidth;
    const capW = w + (capExtraWidth * 2);
    let capY = isTop ? (py + h - capH) : py;

    let capGrad = ctx.createLinearGradient(capX, 0, capX + capW, 0);
    capGrad.addColorStop(0, '#b6f244');
    capGrad.addColorStop(0.2, '#73bf2e');
    capGrad.addColorStop(0.7, '#549f1a');
    capGrad.addColorStop(1, '#254e09');

    ctx.fillStyle = capGrad;
    ctx.fillRect(capX, capY, capW, capH);

    ctx.fillStyle = '#d8f883';
    ctx.fillRect(capX + 4, capY, 4, capH);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.strokeRect(capX, capY, capW, capH);
}

background.init();

function triggerAction() {
    if (gameState === "START") {
        gameState = "PLAYING";
        bird.flap();
    } else if (gameState === "PLAYING") {
        bird.flap();
    } else if (gameState === "GAMEOVER") {
        bird.reset();
        pipes.length = 0;
        feathers.length = 0;
        score = 0;
        gameState = "START";
    }
}

window.addEventListener("keydown", (e) => { if (e.code === "Space") triggerAction(); });
canvas.addEventListener("mousedown", triggerAction);
canvas.addEventListener("touchstart", (e) => { e.preventDefault(); triggerAction(); }, { passive: false });

function update() {
    frameCount++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    if (shakeDuration > 0) {
        ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
        shakeDuration--;
    }

    background.update();
    background.draw();

    if (gameState === "PLAYING") {
        bird.update();

        if (bird.y + bird.height >= canvas.height - 50 || bird.y <= 0) {
            triggerGameOver();
        }

        if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - PIPE_SPACING) {
            spawnPipe();
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
            let p = pipes[i];
            p.x -= PIPE_SPEED;

            let bottomY = p.top + PIPE_GAP;
            let bottomH = canvas.height - bottomY - 50;

            drawPipe(p.x, 0, 54, p.top, true);
            drawPipe(p.x, bottomY, 54, bottomH, false);

            if (bird.x + bird.width > p.x && bird.x < p.x + 54) {
                if (bird.y < p.top || bird.y + bird.height > bottomY) {
                    triggerGameOver();
                    break;
                }
            }

            if (!p.passed && p.x + 54 < bird.x) {
                p.passed = true;
                score++;
                scoreScale = 1.35;
                playSound('score');
                createParticles(p.x + 54, p.top + PIPE_GAP / 2, '#ffcc00', 8);
                spawnFloatingText(bird.x + 10, bird.y - 10, "+1", "#ffffff");

                if (score > highscore) {
                    highscore = score;
                    localStorage.setItem("ult_flappy_highscore", highscore);
                }
            }

            if (p.x + 54 < 0) pipes.splice(i, 1);
        }

        for (let i = feathers.length - 1; i >= 0; i--) {
            let f = feathers[i];
            f.x -= PIPE_SPEED;
            let floatY = f.y + Math.sin(frameCount * 0.08 + f.floatOffset) * 6;

            if (!f.collected) {
                ctx.save();
                ctx.translate(f.x, floatY);
                ctx.fillStyle = "#ffd700";
                ctx.fillRect(-6, -8, 12, 16);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-2, -6, 4, 12);
                ctx.strokeStyle = "#b39200";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-6, -8, 12, 16);
                ctx.restore();

                let dist = Math.hypot((bird.x + bird.width / 2) - f.x, (bird.y + bird.height / 2) - floatY);
                if (dist < 24) {
                    f.collected = true;
                    score += 3;
                    scoreScale = 1.4;
                    playSound('feather');
                    createParticles(f.x, floatY, '#ffd700', 14);
                    spawnFloatingText(f.x, floatY - 10, "+3!", "#ffd700");

                    if (score > highscore) {
                        highscore = score;
                        localStorage.setItem("ult_flappy_highscore", highscore);
                    }
                }
            }

            if (f.x < -20) feathers.splice(i, 1);
        }
    }

    updateParticles();
    bird.draw();
    updateFloatingTexts();

    if (gameState === "START") {
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 4;
        ctx.font = "bold 20px 'Courier New', monospace";
        ctx.textAlign = "center";

        let alpha = 0.6 + Math.sin(frameCount * 0.1) * 0.4;
        ctx.globalAlpha = alpha;
        ctx.strokeText("PRESS SPACE / TAP TO START", canvas.width / 2, canvas.height / 2);
        ctx.fillText("PRESS SPACE / TAP TO START", canvas.width / 2, canvas.height / 2);
        ctx.globalAlpha = 1.0;
    } else if (gameState === "PLAYING") {
        if (scoreScale > 1) scoreScale -= 0.02;
        ctx.save();
        ctx.translate(canvas.width / 2, 60);
        ctx.scale(scoreScale, scoreScale);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 42px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 6;
        ctx.strokeText(score, 0, 0);
        ctx.fillText(score, 0, 0);
        ctx.restore();
    } else if (gameState === "GAMEOVER") {
        drawGameOverCard();
    }

    if (flashOpacity > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashOpacity})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        flashOpacity -= 0.1;
    }

    ctx.restore();
    requestAnimationFrame(update);
}

function triggerGameOver() {
    playSound('hit');
    shakeDuration = 10;
    flashOpacity = 0.8;
    createParticles(bird.x + bird.width / 2, bird.y + bird.height / 2, '#ff3300', 18);
    gameState = "GAMEOVER";
}

function drawGameOverCard() {
    let cx = canvas.width / 2;
    let cy = canvas.height / 2;

    ctx.fillStyle = "#ded895";
    ctx.strokeStyle = "#54381e";
    ctx.lineWidth = 4;
    ctx.fillRect(cx - 120, cy - 100, 240, 180);
    ctx.strokeRect(cx - 120, cy - 100, 240, 180);

    ctx.strokeStyle = "#e2d67a";
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - 114, cy - 94, 228, 168);

    ctx.fillStyle = "#e65c00";
    ctx.font = "bold 24px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 3;
    ctx.strokeText("GAME OVER", cx, cy - 65);
    ctx.fillText("GAME OVER", cx, cy - 65);

    ctx.fillStyle = "#54381e";
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillText("SCORE: " + score, cx, cy - 25);
    ctx.fillText("BEST:  " + highscore, cx, cy + 5);

    let medal = score >= 30 ? "PLATINUM" : score >= 20 ? "GOLD" : score >= 10 ? "SILVER" : "BRONZE";
    let medalColor = score >= 30 ? "#e5e4e2" : score >= 20 ? "#ffcc00" : score >= 10 ? "#c0c0c0" : "#cd7f32";
    
    ctx.fillStyle = medalColor;
    ctx.font = "bold 15px 'Courier New', monospace";
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2;
    ctx.strokeText("MEDAL: " + medal, cx, cy + 35);
    ctx.fillText("MEDAL: " + medal, cx, cy + 35);

    ctx.fillStyle = "#0088cc";
    ctx.font = "bold 13px 'Courier New', monospace";
    let alpha = 0.6 + Math.sin(frameCount * 0.1) * 0.4;
    ctx.globalAlpha = alpha;
    ctx.fillText("TAP TO RESTART", cx, cy + 65);
    ctx.globalAlpha = 1.0;
}

update();
</script>
</body>
</html>
